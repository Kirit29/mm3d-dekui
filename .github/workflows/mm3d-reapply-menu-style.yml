name: Re-apply F1 menu style
# Run by hand after Sync fork, choosing the f1-menu-style branch. Converts any plain ImGui widgets or tabs that
# upstream added to the F1 menu, and commits the result to the chosen branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the branch has the F1 menu style
        run: |
          if [ ! -f tools/mm3d/reapply_menu_style.py ]; then
            echo "::error::This branch has no F1 menu style. Run this workflow on f1-menu-style (Use workflow from > f1-menu-style)."
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test the script
        run: python -m unittest discover -s tools/mm3d -p 'test_reapply_menu_style.py'
      - name: Re-apply menu style
        run: python tools/mm3d/reapply_menu_style.py | tee reapply.txt
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add src/mm3d/overlay.cpp src/mm3d/menu_style.h
          { echo "Re-apply F1 menu style after sync"; echo; cat reapply.txt; } > message.txt
          git commit -F message.txt
          git push
          { echo "### Committed"; echo '```'; cat reapply.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
